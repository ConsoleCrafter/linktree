<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConsoleCrafter</title>
<meta name="description" content="ConsoleCrafter – Gaming & Development. Discord, YouTube und GitHub.">
<meta name="theme-color" content="#000000">
<meta property="og:type" content="website">
<meta property="og:title" content="ConsoleCrafter">
<meta property="og:description" content="Gaming & Development – alle Links an einem Ort.">
<meta property="og:image" content="assets/logo.jpg">
<link rel="icon" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #ff3333;
  --cyan: #00ffff;
  --muted: #9a9a9a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'Press Start 2P', 'Courier New', monospace;
  background: #000;
  color: #fff;
  overflow-x: hidden;
}
#fx2 { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
#matrix { position: fixed; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
.mcol {
  position: absolute; top: 0;
  font: 14px/16px 'Courier New', monospace; white-space: pre; text-align: center;
  color: transparent;
  background: linear-gradient(to bottom, rgba(255,51,51,0), rgba(255,51,51,.75));
  -webkit-background-clip: text; background-clip: text;
  will-change: transform;
  animation: mfall linear infinite;
}
@keyframes mfall {
  from { transform: translate3d(0, -100%, 0); }
  to { transform: translate3d(0, 100vh, 0); }
}

/* Scanlines: statisch, kein Repaint-Dauerfeuer */
.scanlines {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.35) 2px 4px),
    linear-gradient(to right, rgba(255,51,51,.05) 1px, transparent 1px) 0 0 / 20px 100%,
    linear-gradient(to bottom, rgba(0,255,255,.05) 1px, transparent 1px) 0 0 / 100% 20px;
}

:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

.glitch-active { animation: full-glitch .2s linear infinite; }
@keyframes full-glitch {
  0%, 100% { transform: translate(1px, -1px); filter: hue-rotate(90deg); }
  50% { transform: translate(-1px, 1px); filter: hue-rotate(180deg); }
}

.enter-screen {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,.95);
  display: flex; justify-content: center; align-items: center;
  border: 0; cursor: pointer; width: 100%;
  font-family: inherit;
  transition: opacity .5s ease;
}
.enter-text {
  font-size: 2rem; color: var(--accent);
  text-shadow: 0 0 20px var(--accent);
  animation: pulse 2s ease-in-out infinite alternate;
}
@keyframes pulse { from { opacity: .7; } to { opacity: 1; } }

.main-content {
  position: relative; z-index: 2;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; text-align: center;
  opacity: 0; transition: opacity .5s ease;
}
.main-content.visible { opacity: 1; }
.container { max-width: 500px; padding: 0 15px; }
.profile { margin-bottom: 40px; }
.profile-image {
  width: 120px; height: 120px; border-radius: 50%;
  margin: 0 auto 20px; display: block; object-fit: cover;
  border: 3px solid var(--accent);
  box-shadow: 0 0 20px rgba(255,51,51,.6);
}
.profile-name {
  font-size: 28px; font-weight: normal; color: var(--accent);
  margin-bottom: 15px; letter-spacing: 1px; cursor: pointer;
  background: none; border: 0; font-family: inherit;
}
.profile-name:hover { animation: glitch .5s linear infinite; }
@keyframes glitch {
  0%, 100% { text-shadow: 1px 0 var(--accent), -1px 0 var(--cyan); }
  50% { text-shadow: -1px 0 var(--accent), 1px 0 var(--cyan); }
}
.profile-subtitle { font-size: 14px; color: var(--muted); min-height: 1.4em; }
.profile-subtitle span { display: inline-block; transition: transform .1s ease, color .1s ease; }
.profile-subtitle span:hover { transform: translate(2px, -2px); color: var(--accent); }

.social-links { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 30px; }
.social { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.social-icon {
  position: relative; overflow: hidden;
  width: 50px; height: 50px; border-radius: 8px;
  background: rgba(30,30,30,.8); border: 1px solid #333;
  display: flex; align-items: center; justify-content: center;
  text-decoration: none;
  transition: all .2s ease;
}
.social-icon:hover, .social-icon:focus-visible {
  background: rgba(50,50,50,.9);
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent);
  animation: social-glitch .5s linear infinite, social-pulse 1s ease-in-out infinite alternate;
}
.social-icon::before, .social-icon::after {
  content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity .3s ease;
}
.social-icon::before { border: 2px solid var(--accent); animation: border-pulse 1.5s linear infinite; }
.social-icon::after { border: 2px solid var(--cyan); animation: border-pulse 1.5s linear infinite .75s; }
.social-icon:hover::before, .social-icon:hover::after,
.social-icon:focus-visible::before, .social-icon:focus-visible::after { opacity: 1; }
@keyframes border-pulse {
  0% { transform: scale(1); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: scale(1.2); opacity: 0; }
}
@keyframes social-glitch {
  0%, 100% { transform: translate(1px, -3px); }
  50% { transform: translate(-1px, -1px); }
}
@keyframes social-pulse {
  from { box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent); }
  to { box-shadow: 0 0 5px var(--accent), 0 0 40px var(--accent); }
}
.social-icon svg { width: 24px; height: 24px; }
.social-label { font-size: 10px; color: var(--muted); }
.social:hover .social-label, .social:focus-within .social-label { color: var(--accent); }

.music-player {
  position: fixed; top: 20px; left: 20px; z-index: 100;
  background: rgba(12,12,12,.85);
  border: 1px solid rgba(255,51,51,.35);
  border-radius: 999px; padding: 10px 20px 10px 16px;
  display: flex; align-items: center; gap: 14px;
  box-shadow: 0 0 18px rgba(255,51,51,.18);
  transition: border-color .2s ease, box-shadow .2s ease;
}
.music-player:hover { border-color: rgba(255,51,51,.7); box-shadow: 0 0 22px rgba(255,51,51,.35); }
.volume-btn { background: none; border: 0; cursor: pointer; display: flex; border-radius: 50%; }
.volume-icon { width: 22px; height: 22px; fill: #fff; transition: transform .2s ease, fill .2s ease; }
.volume-btn:hover .volume-icon { transform: scale(1.12); fill: var(--accent); }
.volume-slider {
  --fill: 30%;
  -webkit-appearance: none; appearance: none;
  width: 110px; height: 5px; border-radius: 999px; outline: none; cursor: pointer;
  background: linear-gradient(to right, var(--accent) var(--fill), rgba(255,255,255,.22) var(--fill));
}
.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
  background: #fff; border: 0; box-shadow: 0 0 8px rgba(255,51,51,.8);
  transition: transform .15s ease;
}
.volume-slider::-moz-range-thumb {
  width: 13px; height: 13px; border-radius: 50%; border: 0;
  background: #fff; box-shadow: 0 0 8px rgba(255,51,51,.8);
}
.volume-slider::-moz-range-track { background: transparent; }
.volume-slider:hover::-webkit-slider-thumb { transform: scale(1.2); }

.credit {
  position: fixed; bottom: 10px; left: 0; width: 100%; z-index: 100;
  text-align: center; font-size: 8px; line-height: 1.8;
  color: #8a8a8a; pointer-events: none; padding: 0 10px;
}
.credit a { color: #b0b0b0; pointer-events: auto; text-decoration: none; }
.credit a:hover { color: var(--accent); }

@media (max-width: 600px) {
  .music-player { top: 10px; left: 10px; }
  .profile-name { font-size: 22px; }
  .volume-slider { width: 90px; }
}
@media (prefers-reduced-motion: reduce) {
  .enter-text { animation: none; }
}
</style>
</head>

<audio id="bgMusic" loop preload="auto"><source src="assets/dubstep-damage.mp3" type="audio/mpeg"></audio>

<script>
(() => {
  'use strict';

  // ---------- Konfiguration ----------
  const CFG = {
    subtitle: 'Gaming & Development',
    typeDelayMs: 100,
    defaultVolume: 0.3,
    matrixChars: '0123456789ABCDEF!@#$%^&*()_+-=[]{}|;:",./<>?~`',
    matrixFontSize: 14,
    particleCount: 25,
    trailLife: 0.8,           // Sekunden
    trailMax: 25,
    accent: '#ff3333'
  };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const $ = id => document.getElementById(id);
  const enterScreen = $('enterScreen'), mainContent = $('mainContent');
  const music = $('bgMusic'), slider = $('volumeSlider');
  const volBtn = $('volumeBtn'), volIcon = $('volumeIcon');
  const profileName = $('profileName'), subtitle = $('subtitleText');

  // ---------- Musik ----------
  const ICONS = {
    mute: '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>',
    low: '<path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>',
    high: '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>'
  };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };

  let volume = parseFloat(store.get('cc-volume'));
  if (!(volume >= 0 && volume <= 1)) volume = CFG.defaultVolume;
  let lastVolume = parseFloat(store.get('cc-last-volume'));
  if (!(lastVolume > 0 && lastVolume <= 1)) lastVolume = volume > 0 ? volume : CFG.defaultVolume;

  function setVolume(v, save = true) {
    volume = v;
    music.volume = v;
    slider.value = Math.round(v * 100);
    volIcon.innerHTML = v === 0 ? ICONS.mute : v < 0.5 ? ICONS.low : ICONS.high;
    volBtn.setAttribute('aria-label', v === 0 ? 'Ton einschalten' : 'Ton stummschalten');
    slider.style.setProperty('--fill', Math.round(v * 100) + '%');
    if (v > 0) { lastVolume = v; if (save) store.set('cc-last-volume', v); }
    if (save) store.set('cc-volume', v);
  }
  setVolume(volume, false);

  slider.addEventListener('input', e => setVolume(e.target.value / 100));
  volBtn.addEventListener('click', () => setVolume(volume > 0 ? 0 : lastVolume));

  // ---------- Subtitle: Spans einmal beim Tippen erzeugen ----------
  function typeSubtitle() {
    const chars = [...CFG.subtitle];
    let i = 0;
    const step = () => {
      if (i >= chars.length) return;
      const s = document.createElement('span');
      s.textContent = chars[i] === ' ' ? '\u00a0' : chars[i];
      subtitle.appendChild(s);
      i++;
      setTimeout(step, reduceMotion ? 0 : CFG.typeDelayMs);
    };
    step();
  }

  // ---------- Enter ----------
  enterScreen.addEventListener('click', () => {
    enterScreen.style.opacity = '0';
    mainContent.classList.add('visible');
    setTimeout(() => {
      enterScreen.style.display = 'none';
      music.play().catch(() => {
        // Fallback: Ton startet beim nächsten Klick/Tastendruck
        const retry = () => music.play().catch(() => {});
        addEventListener('pointerdown', retry, { once: true });
        addEventListener('keydown', retry, { once: true });
      });
      typeSubtitle();
    }, 500);
  });

  // ---------- Name-Glitch ----------
  profileName.addEventListener('click', () => {
    document.body.classList.add('glitch-active');
    setTimeout(() => document.body.classList.remove('glitch-active'), 500);
  });

  // ---------- Matrix: wenige CSS-Spalten, laufen auf der GPU (kein JS pro Frame) ----------
  const matrix = $('matrix');
  const COL_W = 22;
  const randText = n => Array.from({ length: n }, () =>
    CFG.matrixChars[(Math.random() * CFG.matrixChars.length) | 0]).join('\n');
  let colEls = [];

  function buildMatrix() {
    matrix.textContent = '';
    const count = Math.ceil(innerWidth / COL_W);
    colEls = [];
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'mcol';
      el.textContent = randText(14 + ((Math.random() * 22) | 0));
      el.style.left = i * COL_W + 'px';
      const dur = 6 + Math.random() * 8;
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = -Math.random() * dur + 's';
      matrix.appendChild(el);
      colEls.push(el);
    }
  }
  buildMatrix();

  // Zeichen ab und zu austauschen (immer nur eine Spalte, sehr günstig)
  setInterval(() => {
    if (document.hidden || !colEls.length) return;
    const el = colEls[(Math.random() * colEls.length) | 0];
    el.textContent = randText(14 + ((Math.random() * 22) | 0));
  }, 350);

  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { buildMatrix(); resizeFx(); }, 200); });

  // ---------- Canvas nur für Partikel + Maus-Trail ----------
  const pc = $('fx2'), px = pc.getContext('2d');
  const glow = document.createElement('canvas');
  glow.width = glow.height = 32;
  {
    const g = glow.getContext('2d');
    const grad = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    grad.addColorStop(0, 'rgba(255,90,90,1)');
    grad.addColorStop(0.35, 'rgba(255,51,51,.6)');
    grad.addColorStop(1, 'rgba(255,51,51,0)');
    g.fillStyle = grad; g.fillRect(0, 0, 32, 32);
  }
  let W = 0, H = 0, particles = [], trail = [];
  const newParticle = anywhere => ({
    x: Math.random() * W,
    y: anywhere ? Math.random() * H : H + 10,
    v: 20 + Math.random() * 40,
    r: 1.5 + Math.random() * 1.5
  });
  function resizeFx() {
    W = pc.width = innerWidth; H = pc.height = innerHeight;
    particles = Array.from({ length: CFG.particleCount }, () => newParticle(true));
  }
  resizeFx();

  addEventListener('pointermove', e => {
    trail.push({ x: e.clientX, y: e.clientY, t: performance.now() });
    if (trail.length > CFG.trailMax) trail.shift();
  }, { passive: true });

  const FRAME = 1000 / 30;
  let last = performance.now(), rafId = 0;
  function frame(now) {
    rafId = requestAnimationFrame(frame);
    if (now - last < FRAME) return;
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    px.clearRect(0, 0, W, H);
    for (const p of particles) {
      p.y -= p.v * dt;
      if (p.y < -10) Object.assign(p, newParticle(false));
      const d = p.r * 6;
      px.globalAlpha = 0.8;
      px.drawImage(glow, p.x - d / 2, p.y - d / 2, d, d);
    }
    for (let i = trail.length - 1; i >= 0; i--) {
      const age = (now - trail[i].t) / 1000 / CFG.trailLife;
      if (age >= 1) { trail.splice(0, i + 1); break; }
      const d = (4 * (1 - age) + 2) * 3;
      px.globalAlpha = 0.9 * (1 - age);
      px.drawImage(glow, trail[i].x - d / 2, trail[i].y - d / 2, d, d);
    }
    px.globalAlpha = 1;
  }
  function start() { if (!rafId) { last = performance.now(); rafId = requestAnimationFrame(frame); } }
  function stop() { cancelAnimationFrame(rafId); rafId = 0; }
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
  start();
})();
</script>
